<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>study first bhie</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>

  <body>
    <div id="loading-screen" class="loading-screen" aria-live="polite" aria-busy="true">
      <div class="loading-card">
        <div class="loading-spinner" aria-hidden="true"></div>
        <div class="loading-text">Loading module…</div>
      </div>
    </div>

    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
      <span aria-hidden="true">◐</span><span class="theme-toggle-label">Dark</span>
    </button>
    <div class="deck-wrapper">
      <!-- ALL slides (Cover, Objectives, Lessons, Closing) will be injected here -->
      <div id="slide-container"></div>

    </div>

    <!-- Bump data-changelog-version whenever a new release should be shown again. -->
    <section id="changelog-modal" class="changelog-modal" role="dialog" aria-modal="true" aria-labelledby="changelog-title" aria-describedby="changelog-details" data-changelog-version="2026-10-04" hidden>
      <div class="changelog-card">
        <p class="changelog-kicker">ITP 141 · What’s new</p>
        <h1 id="changelog-title">A more comfortable study view.</h1>
        <div id="changelog-details" class="changelog-details">
          <p>This update improves the presentation experience across devices.</p>
          <ul>
            <li>Slides now reflow into a readable mobile layout.</li>
            <li>Added dark mode.</li>
            <li>Dark mode follows your device preference.</li>
          </ul>
        </div>
        <label class="changelog-choice"><input id="changelog-dismiss" type="checkbox"> <span>Don’t show this update again</span></label>
        <button id="changelog-continue" class="changelog-continue" type="button">Okay</button>
      </div>
    </section>

    <div class="nav-controls">
      <button id="prevBtn">‹ Prev</button>
      <input id="slideCounter" type="text" inputmode="numeric" aria-label="Jump to slide number" value="01" maxlength="2">
      <span class="slideCounter-total">/ 00</span>
      <button id="nextBtn">Next ›</button>
    </div>
  </body>
</html>
